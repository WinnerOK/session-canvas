schema: spec-driven

context: |
  Language: English
  All artifacts must be written in English.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Session Canvas is a personal spatial workspace over existing Codex sessions.
  Use GLOSSARY.md for canonical domain language and docs/domain-model.md for the model.
  Opening a session never acknowledges its result. Viewer acknowledgment requires a loaded unread result in Finished; Acknowledge all explicitly records the latest known results of all Finished sessions in the current source, including filtered notes, without loading viewers. Recheck eligibility and persist a bulk snapshot atomically.
  Mark as unread reverses one known acknowledgment from the viewer in any session state, preserving execution, requests, source membership, and other results.
  Project regions represent actual Codex project membership, not canvas-only tags or working directories.
  Desktop CLI metadata/update projectId only proved backend persistence on 0.164.0-alpha.11.1, not a desktop project move. A live authorized test reproduced backend success with unchanged desktop membership; the native Codex action changed desktop membership independently. Real-source project mutations are disabled before sending any write, while same-project layout and external desktop-project synchronization remain available. Desktop facts precede backend fallback; legacy Canvas confirmations are decoded but ignored and cleared. Keep API-only desktop mutation support, atomic external-write protection, and durable pending recovery open. No Accessibility/UI automation, direct Codex metadata writes, model turns, session resume, or execution-setting changes for project organization.
  The selected delivery is a Mac-only SwiftUI/AppKit companion with a session/result viewer and SQLite storage.
  Do not introduce a web renderer or a cross-platform shell for this application.
  The default source combines saved discovery/history with read-only live desktop observations and explicit project identities.
  Reading the latest history page can establish saved Finished when its last turn is terminal and there is no newer work or pending request, even without a local rollout. Old pages/results alone do not establish current state; revision/file changes and live work retain priority.
  Unknown sessions with a cached terminal result and missing local evidence are rechecked automatically after discovery, one at a time and at most once per second. Cache attempts by source/file/result revision, preserve explicit acknowledgment, and apply state without a full inventory reload or opening the viewer.
  Desktop creation verifies durable history and releases child-process ownership, reveals the new session despite filters, and automatically opens it in Codex; it never starts a model turn. Keep valid clicked placement or choose the nearest valid position for visible/hidden collisions. Creation in the context's project preserves pan/zoom; only a changed chosen/confirmed project or an explicit action requests focus. Blank names and projectless folders receive explained defaults. Submission errors stay in the active dialog.
  Visibility filters and project overviews affect rendering within the selected layer, not source membership or classification. Layer changes materialize independent destination geometry.
  Rearrange builds separate compact, roughly square project and unassigned-session blocks, with adaptive physical-card grids and Attention/status/activity/identity order across note rows. Pack projects by size without rotation; source/sidebar order breaks equal-size ties. Prefer the smallest longer side, then bounding area; unassigned notes stay below projects. Hidden members retain their project-relative offsets and receive its displacement; other hidden notes and fully hidden projects remain fixed and can displace a whole block. Preserve viewport, source facts, and acknowledgments; validate and save the whole layout before applying it.
  Confirmed Archived takes display priority over execution availability. Show exactly one lifecycle layer: Archived and Unknown are Inactive first; otherwise eligible Idle past Hide Idle after is Stale, and remaining sessions are Active. Never leaves Stale empty. The cutoff is shared per source; filters, layouts, viewports, and selection are source-isolated with independent per-layer geometry. Hide unknown is removed. Same-layer filtered occupants remain obstacles; other layers and dormant positions do not. Transitions preserve actual project membership and use valid remembered destination positions or same-project allocation/growth. Creation reveals only its classified layer. See openspec/changes/add-session-layers/ for the layer contract and execution evidence.
  See docs/integration-compatibility.md for verified capabilities and unresolved desktop gates.
  See openspec/changes/add-session-canvas/verification.md for correction-to-requirement and test coverage.
  See openspec/changes/add-session-canvas/functional-coverage.md for the complete function-to-requirement/code/evidence inventory. source-connection specifies startup, preferences, refresh, source identity, demo, status, transport boundaries, and shutdown; source mode and title search are not persisted.
  Read docs/delivery-options.md before making claims about integration support.

